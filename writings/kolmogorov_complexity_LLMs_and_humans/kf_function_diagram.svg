<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title-kf">
  <title id="title-kf">From K(x) to K(f): one program maps many inputs to their outputs</title>
  <defs>
    <marker id="arrowKf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a" />
    </marker>
  </defs>
  <style>
    .box { fill: #f5f1e8; stroke: #2a2a2a; stroke-width: 1.4; }
    .iobox { fill: #f5f1e8; stroke: #7a766d; stroke-width: 1.2; }
    .codeline { stroke: #6a6660; stroke-width: 2.2; stroke-linecap: round; }
    .arrow { stroke: #2a2a2a; stroke-width: 1.6; fill: none; }
    .bracket { stroke: #8a8377; stroke-width: 0.9; fill: none; }
    .iolabel { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 19px; fill: #2a2a2a; text-anchor: middle; }
    .label { font-family: "Inter", -apple-system, sans-serif; font-size: 11px; fill: #6a6660; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
    .formula { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 17px; fill: #2a2a2a; }
    .ellipsis { font-family: "Inter", -apple-system, sans-serif; font-size: 24px; fill: #6a6660; text-anchor: middle; }
  </style>

  <!-- Input boxes -->
  <rect class="iobox" x="40" y="68" width="120" height="46" rx="3" />
  <text class="iolabel" x="100" y="99">x&#x2081;</text>

  <rect class="iobox" x="40" y="140" width="120" height="46" rx="3" />
  <text class="iolabel" x="100" y="171">x&#x2082;</text>

  <rect class="iobox" x="40" y="212" width="120" height="46" rx="3" />
  <text class="iolabel" x="100" y="243">x&#x2083;</text>

  <text class="ellipsis" x="100" y="285">&#x22EE;</text>
  <text class="label" x="100" y="320" text-anchor="middle">inputs</text>

  <!-- Program box -->
  <rect class="box" x="250" y="58" width="240" height="234" rx="3" />
  <line class="codeline" x1="275" y1="80" x2="465" y2="80" />
  <line class="codeline" x1="285" y1="105" x2="460" y2="105" />
  <line class="codeline" x1="270" y1="130" x2="440" y2="130" />
  <line class="codeline" x1="275" y1="155" x2="455" y2="155" />
  <line class="codeline" x1="285" y1="180" x2="465" y2="180" />
  <line class="codeline" x1="270" y1="205" x2="445" y2="205" />
  <line class="codeline" x1="280" y1="230" x2="460" y2="230" />
  <line class="codeline" x1="275" y1="255" x2="450" y2="255" />
  <line class="codeline" x1="270" y1="280" x2="440" y2="280" />

  <text class="label" x="370" y="312" text-anchor="middle">program f (weights)</text>
  <line class="bracket" x1="250" y1="324" x2="250" y2="332" />
  <line class="bracket" x1="250" y1="332" x2="490" y2="332" />
  <line class="bracket" x1="490" y1="332" x2="490" y2="324" />
  <text class="label" x="370" y="349" text-anchor="middle">|f|</text>

  <!-- Output boxes -->
  <rect class="iobox" x="600" y="68" width="120" height="46" rx="3" />
  <text class="iolabel" x="660" y="99">y&#x2081;</text>

  <rect class="iobox" x="600" y="140" width="120" height="46" rx="3" />
  <text class="iolabel" x="660" y="171">y&#x2082;</text>

  <rect class="iobox" x="600" y="212" width="120" height="46" rx="3" />
  <text class="iolabel" x="660" y="243">y&#x2083;</text>

  <text class="ellipsis" x="660" y="285">&#x22EE;</text>
  <text class="label" x="660" y="320" text-anchor="middle">outputs</text>

  <!-- Arrows: input → program -->
  <line class="arrow" x1="165" y1="91" x2="245" y2="91" marker-end="url(#arrowKf)" />
  <line class="arrow" x1="165" y1="163" x2="245" y2="163" marker-end="url(#arrowKf)" />
  <line class="arrow" x1="165" y1="235" x2="245" y2="235" marker-end="url(#arrowKf)" />

  <!-- Arrows: program → output -->
  <line class="arrow" x1="495" y1="91" x2="595" y2="91" marker-end="url(#arrowKf)" />
  <line class="arrow" x1="495" y1="163" x2="595" y2="163" marker-end="url(#arrowKf)" />
  <line class="arrow" x1="495" y1="235" x2="595" y2="235" marker-end="url(#arrowKf)" />

  <!-- Bottom formula -->
  <text class="formula" x="380" y="385" text-anchor="middle">K(f) = length of the shortest program f such that f(x&#x1D62;) = y&#x1D62; for every pair</text>
</svg>
