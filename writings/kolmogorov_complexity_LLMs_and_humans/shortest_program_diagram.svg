<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title-shortest">
  <title id="title-shortest">Kolmogorov complexity: a small program produces a long binary string</title>
  <defs>
    <marker id="arrowK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a" />
    </marker>
  </defs>
  <style>
    .box { fill: #f5f1e8; stroke: #2a2a2a; stroke-width: 1.4; }
    .cell { fill: #f5f1e8; stroke: #7a766d; stroke-width: 1; }
    .codeline { stroke: #6a6660; stroke-width: 2.2; stroke-linecap: round; }
    .arrow { stroke: #2a2a2a; stroke-width: 1.6; fill: none; }
    .bracket { stroke: #8a8377; stroke-width: 0.9; fill: none; }
    .digit { font-family: "Menlo", "JetBrains Mono", monospace; font-size: 15px; fill: #2a2a2a; text-anchor: middle; }
    .label { font-family: "Inter", -apple-system, sans-serif; font-size: 11px; fill: #6a6660; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
    .arrlabel { font-family: "Inter", -apple-system, sans-serif; font-size: 12px; fill: #555; font-style: italic; }
    .formula { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 17px; fill: #2a2a2a; }
    .ellipsis { font-family: "Inter", -apple-system, sans-serif; font-size: 26px; fill: #6a6660; }
  </style>
  <rect class="box" x="70" y="70" width="175" height="140" rx="3" />
  <line class="codeline" x1="92" y1="95" x2="212" y2="95" />
  <line class="codeline" x1="102" y1="120" x2="207" y2="120" />
  <line class="codeline" x1="85" y1="145" x2="180" y2="145" />
  <line class="codeline" x1="95" y1="170" x2="210" y2="170" />
  <text class="label" x="157.5" y="232" text-anchor="middle">program p</text>
  <line class="bracket" x1="70" y1="252" x2="70" y2="260" />
  <line class="bracket" x1="70" y1="260" x2="245" y2="260" />
  <line class="bracket" x1="245" y1="260" x2="245" y2="252" />
  <text class="label" x="157.5" y="277" text-anchor="middle">|p|</text>
  <line class="arrow" x1="260" y1="140.0" x2="320" y2="140.0" marker-end="url(#arrowK)" />
  <text class="arrlabel" x="290.0" y="131.0" text-anchor="middle">outputs</text>
  <text class="arrlabel" x="290.0" y="160.0" text-anchor="middle">&amp; halts</text>
  <rect class="cell" x="340" y="124.0" width="22" height="32" />
  <text class="digit" x="351.0" y="145.0">0</text>
  <rect class="cell" x="362" y="124.0" width="22" height="32" />
  <text class="digit" x="373.0" y="145.0">1</text>
