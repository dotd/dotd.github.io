  <text class="digit" x="439.0" y="145.0">0</text>
  <rect class="cell" x="450" y="124.0" width="22" height="32" />
  <text class="digit" x="461.0" y="145.0">1</text>
  <rect class="cell" x="472" y="124.0" width="22" height="32" />
  <text class="digit" x="483.0" y="145.0">0</text>
  <rect class="cell" x="494" y="124.0" width="22" height="32" />
  <text class="digit" x="505.0" y="145.0">1</text>
  <rect class="cell" x="516" y="124.0" width="22" height="32" />
  <text class="digit" x="527.0" y="145.0">0</text>
  <rect class="cell" x="538" y="124.0" width="22" height="32" />
  <text class="digit" x="549.0" y="145.0">1</text>
  <rect class="cell" x="560" y="124.0" width="22" height="32" />
  <text class="digit" x="571.0" y="145.0">0</text>
  <rect class="cell" x="582" y="124.0" width="22" height="32" />
  <text class="digit" x="593.0" y="145.0">1</text>
  <rect class="cell" x="604" y="124.0" width="22" height="32" />
  <text class="digit" x="615.0" y="145.0">0</text>
  <rect class="cell" x="626" y="124.0" width="22" height="32" />
  <text class="digit" x="637.0" y="145.0">1</text>
  <rect class="cell" x="648" y="124.0" width="22" height="32" />
  <text class="digit" x="659.0" y="145.0">0</text>
  <rect class="cell" x="670" y="124.0" width="22" height="32" />
  <text class="digit" x="681.0" y="145.0">1</text>
  <text class="ellipsis" x="698" y="149.0">&#x22EF;</text>
  <text class="label" x="516.0" y="232" text-anchor="middle">output x</text>
  <line class="bracket" x1="340" y1="252" x2="340" y2="260" />
  <line class="bracket" x1="340" y1="260" x2="710" y2="260" />
  <line class="bracket" x1="710" y1="260" x2="710" y2="252" />
  <text class="label" x="525.0" y="277" text-anchor="middle">|x|  (much larger)</text>
  <text class="formula" x="360.0" y="320" text-anchor="middle">K(x) = length of the shortest p that outputs x and halts</text>
</svg>