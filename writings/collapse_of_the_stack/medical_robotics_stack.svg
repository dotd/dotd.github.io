<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 812" role="img" aria-label="The medical-robotics stack: ten layers from physical hardware to market, color-coded into core craft, engineering, and scaffolding.">
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .title { font-size: 23px; font-weight: 700; fill: #1a1a1a; }
    .sub { font-size: 13px; fill: #555; }
    .lg { font-size: 12px; fill: #555; }
    .lt { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
    .le { font-size: 12px; fill: #555; }
    .num { font-size: 14px; font-weight: 700; fill: #fff; }
  </style>

  <text class="title" x="18" y="34">The Medical-Robotics Stack</text>
  <text class="sub" x="18" y="58">Ten layers a company must own — from the physical core to the market.</text>

  <!-- Legend -->
  <circle cx="25" cy="86" r="7" fill="#5a4a30"/>
  <text class="lg" x="38" y="90">Core craft — stays human</text>
  <circle cx="256" cy="86" r="7" fill="#786a48"/>
  <text class="lg" x="269" y="90">Engineering — AI-accelerated</text>
  <circle cx="521" cy="86" r="7" fill="#8f7f58"/>
  <text class="lg" x="534" y="90">Scaffolding — compressing fast</text>

  <!-- Layer 1 -->
  <rect x="18" y="118" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="149" r="17" fill="#5a4a30"/>
  <text class="num" x="52" y="154" text-anchor="middle">1</text>
  <text class="lt" x="86" y="145">Mechanical &amp; robotic hardware</text>
  <text class="le" x="86" y="165">Kinematics, actuators, end-effectors and instruments — the sterilizable physical machine.</text>

  <!-- Layer 2 -->
  <rect x="18" y="186" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="217" r="17" fill="#786a48"/>
  <text class="num" x="52" y="222" text-anchor="middle">2</text>
  <text class="lt" x="86" y="213">Electronics, power &amp; firmware</text>
  <text class="le" x="86" y="233">PCBs, motor drivers, embedded compute, and the real-time safety control loops.</text>

  <!-- Layer 3 -->
  <rect x="18" y="254" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="285" r="17" fill="#786a48"/>
  <text class="num" x="52" y="290" text-anchor="middle">3</text>
  <text class="lt" x="86" y="281">Perception &amp; sensing</text>
  <text class="le" x="86" y="301">Vision, intra-op imaging (OCT, ultrasound, CT), force-torque sensing and sensor fusion.</text>

  <!-- Layer 4 -->
  <rect x="18" y="322" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="353" r="17" fill="#786a48"/>
  <text class="num" x="52" y="358" text-anchor="middle">4</text>
  <text class="lt" x="86" y="349">Software platform &amp; middleware</text>
  <text class="le" x="86" y="369">Motion planning, kinematics solvers, registration, data pipelines and device communication.</text>

  <!-- Layer 5 -->
  <rect x="18" y="390" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="421" r="17" fill="#786a48"/>
  <text class="num" x="52" y="426" text-anchor="middle">5</text>
  <text class="lt" x="86" y="417">Autonomy, algorithms &amp; AI</text>
  <text class="le" x="86" y="437">Surgical scene understanding, planning and ML models — the climb up the autonomy ladder.</text>

  <!-- Layer 6 -->
  <rect x="18" y="458" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="489" r="17" fill="#5a4a30"/>
  <text class="num" x="52" y="494" text-anchor="middle">6</text>
  <text class="lt" x="86" y="485">Clinical application &amp; surgeon UX</text>
  <text class="le" x="86" y="505">The procedure software, console and workflow the surgeon actually operates.</text>

  <!-- Layer 7 -->
  <rect x="18" y="526" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="557" r="17" fill="#8f7f58"/>
  <text class="num" x="52" y="562" text-anchor="middle">7</text>
  <text class="lt" x="86" y="553">Quality &amp; regulatory</text>
  <text class="le" x="86" y="573">ISO 13485, ISO 14971, IEC 62304 and FDA 510(k)/PMA or CE-MDR submissions.</text>

  <!-- Layer 8 -->
  <rect x="18" y="594" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="625" r="17" fill="#8f7f58"/>
  <text class="num" x="52" y="630" text-anchor="middle">8</text>
  <text class="lt" x="86" y="621">Clinical affairs &amp; evidence</text>
  <text class="le" x="86" y="641">Preclinical and cadaver studies, clinical trials, KOLs and surgeon training.</text>

  <!-- Layer 9 -->
  <rect x="18" y="662" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="693" r="17" fill="#8f7f58"/>
  <text class="num" x="52" y="698" text-anchor="middle">9</text>
  <text class="lt" x="86" y="689">Manufacturing &amp; supply chain</text>
  <text class="le" x="86" y="709">DFM, contract manufacturing, sourcing, sterilization and the consumables stream.</text>

  <!-- Layer 10 -->
  <rect x="18" y="730" width="784" height="62" rx="5" fill="#ffffff" stroke="#e7e2da"/>
  <circle cx="52" cy="761" r="17" fill="#8f7f58"/>
  <text class="num" x="52" y="766" text-anchor="middle">10</text>
  <text class="lt" x="86" y="757">Commercial, ops &amp; back office</text>
  <text class="le" x="86" y="777">Sales, distribution, reimbursement and service; plus finance, HR, legal and IP.</text>
</svg>
